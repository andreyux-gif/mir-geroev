<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 484" width="724" height="484">
  <title>Мир Ланы: там, где всё (почти) в кошках</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FD3FA"/>
      <stop offset="1" stop-color="#E8F5FF"/>
    </linearGradient>
    <radialGradient id="cornerL" cx="0" cy="0" r=".5">
      <stop offset="0" stop-color="#B48CF0" stop-opacity=".7"/>
      <stop offset="1" stop-color="#B48CF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerR" cx="1" cy="0" r=".5">
      <stop offset="0" stop-color="#B48CF0" stop-opacity=".7"/>
      <stop offset="1" stop-color="#B48CF0" stop-opacity="0"/>
    </radialGradient>
    <!-- Сидящая кошка; цвет шерсти — fill у use, глаза — color -->
    <g id="cat" stroke="#2B2233" stroke-width="4" stroke-linejoin="round">
      <path d="M22 34 C46 30 52 8 40 -2" fill="none" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="0" cy="26" rx="26" ry="30"/>
      <path d="M-22 -18 L-20 -46 L-4 -30 Z"/>
      <path d="M22 -18 L20 -46 L4 -30 Z"/>
      <circle cx="0" cy="-14" r="25"/>
      <circle cx="-9" cy="-16" r="4.5" fill="currentColor" stroke="none"/>
      <circle cx="9" cy="-16" r="4.5" fill="currentColor" stroke="none"/>
      <path d="M-4 -6 L0 -3 L4 -6" fill="none" stroke-width="3" stroke-linecap="round"/>
      <path d="M-30 -10 h-12 M-30 -4 h-12 M30 -10 h12 M30 -4 h12" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- Голова выглядывающей кошки -->
    <g id="peek" stroke="#2B2233" stroke-width="4" stroke-linejoin="round">
      <path d="M-22 -4 L-20 -32 L-4 -16 Z"/>
      <path d="M22 -4 L20 -32 L4 -16 Z"/>
      <circle cx="0" cy="0" r="25"/>
      <circle cx="-9" cy="-2" r="4.5" fill="currentColor" stroke="none"/>
      <circle cx="9" cy="-2" r="4.5" fill="currentColor" stroke="none"/>
      <path d="M-4 8 L0 11 L4 8" fill="none" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="724" height="484" fill="url(#sky)"/>
  <rect width="724" height="484" fill="url(#cornerL)"/>
  <rect width="724" height="484" fill="url(#cornerR)"/>
  <g fill="#FFFFFF" opacity=".55">
    <rect x="120" y="96" width="180" height="10" rx="5"/>
    <rect x="420" y="120" width="200" height="10" rx="5"/>
    <rect x="200" y="150" width="140" height="8" rx="4"/>
  </g>

  <!-- Поляна -->
  <path d="M0 330 Q362 262 724 330 L724 484 L0 484 Z" fill="#C6EBA5" stroke="#2B2233" stroke-width="5" stroke-linejoin="round"/>

  <!-- Кошки -->
  <use href="#peek" transform="translate(96 296) scale(1.3)" fill="#3A3344" color="#FFE45C"/>
  <use href="#cat" transform="translate(196 290) scale(1.5)" fill="#FFFFFF" color="#2B2233"/>
  <use href="#peek" transform="translate(296 336) scale(1.1)" fill="#FFB36B" color="#2B2233"/>
  <use href="#cat" transform="translate(476 290) scale(1.5)" fill="#3A3344" color="#FFE45C"/>
  <use href="#cat" transform="translate(596 318) scale(1.2)" fill="#C9C3D3" color="#2B2233"/>
  <use href="#peek" transform="translate(672 262) scale(1.1)" fill="#FFFFFF" color="#2B2233"/>
</svg>
