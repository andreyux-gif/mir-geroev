<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 484" width="724" height="484">
  <title>Мир Йоши: с жёлтым небом</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD93D"/>
      <stop offset="1" stop-color="#FFF4B0"/>
    </linearGradient>
    <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="0" y1="-4" x2="0" y2="84">
      <stop offset="0" stop-color="#FF5A6E"/><stop offset=".2" stop-color="#FF5A6E"/>
      <stop offset=".2" stop-color="#FFD84A"/><stop offset=".4" stop-color="#FFD84A"/>
      <stop offset=".4" stop-color="#6FD36A"/><stop offset=".6" stop-color="#6FD36A"/>
      <stop offset=".6" stop-color="#4FB4FF"/><stop offset=".8" stop-color="#4FB4FF"/>
      <stop offset=".8" stop-color="#B07CFF"/><stop offset="1" stop-color="#B07CFF"/>
    </linearGradient>
  </defs>

  <rect width="724" height="484" fill="url(#sky)"/>
  <circle cx="120" cy="120" r="44" fill="#FFF8D6" stroke="#2B2233" stroke-width="5"/>

  <!-- Надпись Yoshi в небе, «от руки» -->
  <g transform="translate(440 112) scale(2.2)" fill="none" stroke="#2B2233" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
