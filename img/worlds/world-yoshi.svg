    <rect x="-11" y="38" width="22" height="46" rx="7" fill="#A9DCFF" stroke-width="3.5"/>
    <path d="M-6 84 V96 M6 84 V96" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="22" r="20" fill="#FFE8DA" stroke-width="3.5"/>
    <path d="M-20 22 C-22 4 -10 -4 0 -4 C10 -4 22 4 20 22 C14 14 8 12 0 14 C-8 12 -14 14 -20 22 Z" fill="url(#rainbow)" stroke-width="3.5"/>
    <circle cx="-7" cy="24" r="5.5" fill="#4FC24A" stroke-width="2.5"/>
    <circle cx="7" cy="24" r="5.5" fill="#4FC24A" stroke-width="2.5"/>
