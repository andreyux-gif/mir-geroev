    <path d="M44 11 q-5 -3 -8 1 q-1 4 5 5 q6 2 3 6 q-3 3 -9 0"/>
    <path d="M51 0 L51 22 M51 14 q5 -6 10 0 L61 22"/>
    <path d="M68 11 L68 22"/>
