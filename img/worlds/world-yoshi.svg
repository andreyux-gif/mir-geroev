  </g>

  <!-- Поле -->
  <path d="M0 330 Q300 290 724 336 L724 484 L0 484 Z" fill="#CDEB9C" stroke="#2B2233" stroke-width="5" stroke-linejoin="round"/>
  <path d="M0 420 Q330 380 724 424 L724 484 L0 484 Z" fill="#B5DE84" stroke="#2B2233" stroke-width="5" stroke-linejoin="round"/>

