  <g transform="translate(560 214) scale(1.5)" stroke="#2B2233" stroke-linejoin="round">
    <path d="M-14 46 C-30 36 -42 38 -48 46 C-40 46 -36 50 -34 54 C-28 50 -20 50 -14 54 Z" fill="#2B2233" stroke-width="3"/>
