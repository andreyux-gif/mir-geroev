  <g fill="none" stroke="#E59474" stroke-width="3" stroke-linecap="round" opacity=".8">
    <path d="M140 120 C150 110 160 106 172 104"/>
    <path d="M226 96 C244 96 258 104 266 116"/>
    <path d="M110 170 C106 190 104 206 104 222"/>
    <path d="M292 170 C296 190 298 206 298 222"/>
  </g>
  <path d="M150 108 C168 94 190 88 212 90" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity=".5"/>

  <!-- Обеспокоенные брови -->
  <path d="M132 176 L158 166 M268 176 L242 166" stroke="#2B2233" stroke-width="5" stroke-linecap="round"/>

  <!-- Румянец -->
  <ellipse cx="124" cy="284" rx="26" ry="15" fill="url(#blush)"/>
  <ellipse cx="276" cy="284" rx="26" ry="15" fill="url(#blush)"/>

  <!-- Большие круглые глаза -->
  <g>
    <circle cx="147" cy="228" r="46" fill="url(#lens)"/>
    <circle cx="253" cy="228" r="46" fill="url(#lens)"/>
    <circle cx="150" cy="234" r="35" fill="url(#iris)" stroke="#2B2233" stroke-width="3"/>
    <circle cx="250" cy="234" r="35" fill="url(#iris)" stroke="#2B2233" stroke-width="3"/>
    <circle cx="150" cy="237" r="21" fill="#24384A"/>
    <circle cx="250" cy="237" r="21" fill="#24384A"/>
    <circle cx="162" cy="221" r="10" fill="#FFFFFF"/>
    <circle cx="262" cy="221" r="10" fill="#FFFFFF"/>
    <circle cx="139" cy="250" r="5" fill="#FFFFFF"/>
    <circle cx="239" cy="250" r="5" fill="#FFFFFF"/>
    <circle cx="147" cy="228" r="46" fill="none" stroke="#2B2233" stroke-width="7"/>
    <circle cx="253" cy="228" r="46" fill="none" stroke="#2B2233" stroke-width="7"/>
  </g>

  <!-- Ротик «ω» -->
  <path d="M184 290 q8 10 16 0 q8 10 16 0" fill="none" stroke="#2B2233" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
