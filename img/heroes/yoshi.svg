    <ellipse cx="25" cy="16" rx="6" ry="6.5"/>
    <path d="M44 11 q-5 -3 -8 1 q-1 4 5 5 q6 2 3 6 q-3 3 -9 0"/>
    <path d="M51 0 L51 22 M51 14 q5 -6 10 0 L61 22"/>
    <path d="M68 11 L68 22"/>
    <circle cx="68" cy="4" r="1.4" fill="#2B2233"/>
  </g>
  <path d="M162 420 Q164 490 168 556" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity=".25"/>

  <!-- Ушки -->
  <ellipse cx="90" cy="232" rx="14" ry="20" fill="url(#skin)" stroke="#2B2233" stroke-width="5"/>
  <ellipse cx="310" cy="232" rx="14" ry="20" fill="url(#skin)" stroke="#2B2233" stroke-width="5"/>

  <!-- Голова -->
  <circle cx="200" cy="212" r="112" fill="url(#skin)" stroke="#2B2233" stroke-width="5"/>

  <!-- Короткие лохматые волосы -->
  <path d="M92 246 C78 196 86 142 118 114 C108 98 110 84 122 76 C130 90 140 96 150 96 C160 74 186 62 210 70 C234 58 264 66 278 86 C294 84 306 94 308 106 C298 106 294 112 294 120 C320 148 326 198 310 246 C304 222 298 206 288 194 C284 172 276 160 264 152 C262 166 254 176 242 180 C240 164 232 152 222 146 C214 160 200 168 186 170 C186 156 180 146 170 140 C160 156 144 164 128 166 C114 182 100 212 92 246 Z"
