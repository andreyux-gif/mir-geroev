  <path d="M182 326 Q200 346 218 326" fill="none" stroke="#2B2233" stroke-width="4" stroke-linecap="round"/>
  <path d="M144 396 V360 M256 396 V360" stroke="#2B2233" stroke-width="3.5" stroke-linecap="round" opacity=".6"/>
  <g transform="translate(172 376) scale(.8)" fill="none" stroke="#2B2233" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
