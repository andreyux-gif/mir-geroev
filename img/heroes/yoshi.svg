<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 720" width="400" height="720">
  <title>Йоши</title>
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3D2"/>
      <stop offset="1" stop-color="#F7B99C"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7DCCB"/>
      <stop offset=".4" stop-color="#FFF8F2"/>
      <stop offset="1" stop-color="#F3D2BF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5AD6"/>
      <stop offset=".45" stop-color="#A97BEA"/>
      <stop offset="1" stop-color="#8452CF"/>
    </linearGradient>
    <radialGradient id="skin" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#FFF4EC"/>
      <stop offset="1" stop-color="#FFDCC8"/>
    </radialGradient>
    <radialGradient id="blush" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF7E9A" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FF7E9A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx=".5" cy=".62" r=".6">
      <stop offset="0" stop-color="#F1F7FB"/>
      <stop offset=".55" stop-color="#BBD8EC"/>
      <stop offset="1" stop-color="#7FA5C2"/>
    </radialGradient>
    <radialGradient id="lens" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F3FF"/>
    </radialGradient>
  </defs>

  <!-- Тень на земле -->
  <ellipse cx="200" cy="694" rx="100" ry="14" fill="#2B2233" opacity=".14"/>

  <!-- Ноги -->
  <rect x="160" y="596" width="32" height="92" rx="12" fill="#CFCBD6" stroke="#2B2233" stroke-width="5"/>
  <rect x="208" y="596" width="32" height="92" rx="12" fill="#CFCBD6" stroke="#2B2233" stroke-width="5"/>
  <path d="M156 676 h40 a6 6 0 0 1 0 14 h-34 a8 8 0 0 1 -6 -14 z" fill="#4A4058" stroke="#2B2233" stroke-width="4"/>
  <path d="M204 676 h40 a6 6 0 0 1 0 14 h-34 a8 8 0 0 1 -6 -14 z" fill="#4A4058" stroke="#2B2233" stroke-width="4"/>

  <!-- Руки -->
  <rect x="112" y="340" width="32" height="222" rx="16" fill="url(#skin)" stroke="#2B2233" stroke-width="5"/>
  <rect x="256" y="340" width="32" height="222" rx="16" fill="url(#skin)" stroke="#2B2233" stroke-width="5"/>

  <!-- Штаны -->
  <rect x="152" y="540" width="96" height="72" rx="6" fill="#CFCBD6" stroke="#2B2233" stroke-width="5"/>
  <path d="M200 562 V612" stroke="#2B2233" stroke-width="4" stroke-linecap="round"/>

  <!-- Фиолетовая футболка с надписью -->
  <path d="M108 372 Q108 336 140 328 L150 326 Q200 316 250 326 L260 328 Q292 336 292 372 L292 392 L256 396 L256 548 Q256 572 232 572 L168 572 Q144 572 144 548 L144 396 L108 392 Z"
